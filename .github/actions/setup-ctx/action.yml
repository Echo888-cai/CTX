name: Setup CTX
description: Install the CTX CLI from GitHub Releases (falls back to cargo install)
inputs:
  version:
    description: Release tag without the leading v, or latest
    required: false
    default: latest
  init:
    description: Run ctx init after install
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install CTX
      shell: bash
      env:
        CTX_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        os="$(uname -s)"
        arch="$(uname -m)"
        if [ "$CTX_VERSION" = "latest" ]; then
          tag="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/Echo888-cai/CTX/releases/latest)"
          tag="${tag%/}"
          tag="${tag##*/}"
        else
          tag="v${CTX_VERSION#v}"
        fi
        ver="${tag#v}"
        case "$os-$arch" in
          Darwin-arm64) files="CTX-Apple-Arm-cli-v${ver}.tar.gz" ;;
          Darwin-x86_64) files="CTX-Apple-Intel-cli-v${ver}.tar.gz" ;;
          Linux-x86_64) files="CTX-Linux-x64-v${ver}.tar.gz CTX-Linux-x64-musl-v${ver}.tar.gz" ;;
          Linux-aarch64) files="CTX-Linux-Arm-v${ver}.tar.gz" ;;
          *) echo "unsupported $os-$arch"; exit 1 ;;
        esac
        dest="${HOME}/.local/bin"
        mkdir -p "$dest"
        tmp="$(mktemp -d)"
        installed=
        for file in $files; do
          url="https://github.com/Echo888-cai/CTX/releases/download/${tag}/${file}"
          if curl -fsSL "$url" -o "$tmp/ctx.tar.gz"; then
            tar -C "$tmp" -xzf "$tmp/ctx.tar.gz"
            if [ -f "$tmp/ctx" ]; then
              install -m 755 "$tmp/ctx" "$dest/ctx"
              installed=1
              break
            fi
            found="$(find "$tmp" -maxdepth 2 -type f \( -name ctx -o -name 'ctx-*' \) | head -1)"
            if [ -n "$found" ]; then
              install -m 755 "$found" "$dest/ctx"
              installed=1
              break
            fi
          fi
        done
        if [ -z "$installed" ]; then
          echo "prebuilt missing; building with cargo"
          cargo install --git https://github.com/Echo888-cai/CTX --locked --force ctx-cli
          dest="${CARGO_HOME:-$HOME/.cargo}/bin"
        fi
        echo "$dest" >> "$GITHUB_PATH"
        "$dest/ctx" --version || ctx --version
    - name: ctx init
      if: inputs.init == 'true'
      shell: bash
      run: ctx init
