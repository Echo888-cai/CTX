name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ctx-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: ctx-aarch64-unknown-linux-gnu
            use_cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: ctx-x86_64-unknown-linux-musl
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ctx-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: ctx-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ctx-x86_64-pc-windows-msvc
            exe: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          BIN=ctx
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p ctx-cli
          else
            cargo build --release --locked --target ${{ matrix.target }} -p ctx-cli
          fi
          OUT="target/${{ matrix.target }}/release/${BIN}"
          if [ "${{ matrix.exe }}" = "true" ]; then
            OUT="${OUT}.exe"
            cp "$OUT" "${{ matrix.artifact }}.exe"
            echo "ASSET=${{ matrix.artifact }}.exe" >> "$GITHUB_ENV"
          else
            cp "$OUT" "${{ matrix.artifact }}"
            tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
            echo "ASSET=${{ matrix.artifact }}.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
