[workspace]
resolver = "2"
members = [
    "crates/ctx-protocol",
    "crates/ctx-store",
    "crates/ctx-optimizer",
    "crates/ctx-pager",
    "crates/ctx-telemetry",
    "crates/ctx-ledger",
    "crates/ctx-core",
    "crates/ctx-mcp",
    "apps/cli",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
rust-version = "1.80"
authors = ["Echo888-cai"]
repository = "https://github.com/Echo888-cai/CTX"
homepage = "https://github.com/Echo888-cai/CTX"
description = "Virtual memory for AI context"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ctx-core = { path = "crates/ctx-core" }
ctx-ledger = { path = "crates/ctx-ledger" }
ctx-mcp = { path = "crates/ctx-mcp" }
ctx-optimizer = { path = "crates/ctx-optimizer" }
ctx-pager = { path = "crates/ctx-pager" }
ctx-protocol = { path = "crates/ctx-protocol" }
ctx-store = { path = "crates/ctx-store" }
ctx-telemetry = { path = "crates/ctx-telemetry" }
dirs = "6"
r2d2 = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "process"] }
memmap2 = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
