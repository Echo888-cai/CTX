<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CTX</title>
<style>
  :root {
    --paper: #fbfcfb; --ink: #111311; --muted: #6e736f; --quiet: #969b97;
    --line: #e6e9e6; --grid: #e9ece9; --wash: #f3f5f3; --green: #078b45; --raw: #8e969f;
    --kept-50: #eff5fd; --kept-100: #dce9fa; --kept-300: #a8c8ef; --kept-400: #7faee8;
    --kept-600: #4a83ce; --kept-text: #2f6fbf;
    --save-50: #edf7f1; --save-100: #d8f1e3; --save-300: #a3dcbe; --save-400: #86cfa8;
    --save-600: #4fa97b; --save-text: #2f8f5f;
    --shadow: 0 10px 30px rgba(17, 19, 17, .06);
    --inset: inset 0 1px 0 rgba(255,255,255,.7);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-width: 320px; min-height: 100%; background: var(--paper); color: var(--ink); }
  body {
    font: 15px/1.45 "SF Pro Text", "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    background:
      radial-gradient(1200px 520px at 12% -8%, rgba(7, 139, 69, .05), transparent 60%),
      radial-gradient(900px 480px at 100% 0%, rgba(47, 111, 191, .04), transparent 55%),
      linear-gradient(180deg, #ffffff 0%, var(--paper) 42%, #f4f6f4 100%);
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  main.dashboard { position: relative; z-index: 1; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .dashboard {
    width: min(1180px, calc(100% - 72px));
    min-height: calc(100vh - 32px);
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    column-gap: 24px;
    grid-template-rows: auto auto auto auto auto 1fr;
  }
  .topbar, .kpis, .composition, .ledger, .row-trend { grid-column: 1 / -1; min-width: 0; }
  .topbar {
    min-height: 138px; display: flex; align-items: center; justify-content: space-between;
    gap: 36px; padding-top: 46px;
  }
  .brand-group { min-width: 0; display: flex; align-items: center; gap: 16px; }
  .brand { display: block; width: 168px; flex: 0 0 168px; line-height: 0; filter: drop-shadow(0 1px 0 rgba(255,255,255,.8)); }
  .brand img { display: block; width: 100%; height: auto; background: transparent; }
  .slogan {
    color: var(--muted); font-size: 15px; letter-spacing: .02em; white-space: nowrap;
    line-height: 1; display: flex; align-items: center; margin: 0; padding: 0;
  }
  .controls { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .status {
    display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px;
    border-radius: 999px; background: rgba(7, 139, 69, .08);
    color: var(--green); font-size: 13px; font-weight: 600; white-space: nowrap;
    box-shadow: var(--inset);
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: breathe 2.4s ease-in-out infinite; }
  .status.off { background: var(--wash); color: var(--muted); }
  .status.off .status-dot { animation: none; }
  .control {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 12px; max-width: 260px;
    border: 1px solid var(--line); border-radius: 10px;
    background: rgba(255,255,255,.78); color: var(--ink);
    font-size: 13px; line-height: 1; white-space: nowrap;
    appearance: none; cursor: pointer;
    box-shadow: var(--inset), 0 1px 2px rgba(17,19,17,.03);
    backdrop-filter: blur(8px);
    transition: border-color .16s ease, box-shadow .16s ease, transform .16s ease;
  }
  .control:hover { border-color: #c9cec9; box-shadow: var(--inset), 0 4px 12px rgba(17,19,17,.05); }
  .control .icon { flex: 0 0 auto; color: var(--muted); }
  .control .label { overflow: hidden; text-overflow: ellipsis; }
  .control .chev { flex: 0 0 auto; margin-left: 2px; color: var(--quiet); transition: transform .16s ease; }
  .control.open { border-color: rgba(7, 139, 69, .45); box-shadow: 0 0 0 3px rgba(7, 139, 69, .12), var(--inset); }
  .control.open .chev { transform: rotate(180deg); }
  .ctl { position: relative; z-index: 8; }
  .ctl-sep { width: 1px; height: 20px; margin: 0 4px; background: var(--line); }
  .control.icon-btn { width: 36px; padding: 0; justify-content: center; }
  .control.icon-btn .icon { color: var(--muted); transition: transform .35s ease, color .2s ease; }
  .control.icon-btn:hover .icon { color: var(--ink); transform: rotate(35deg); }
  .pop {
    position: absolute; top: calc(100% + 8px); right: 0;
    border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.94);
    box-shadow: var(--shadow), 0 1px 0 rgba(255,255,255,.8) inset;
    backdrop-filter: blur(14px);
  }
  .model-pop { width: 316px; padding: 6px; }
  .model-search { padding: 6px 6px 8px; }
  .model-search input {
    width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--line);
    border-radius: 7px; background: var(--paper); font: inherit; font-size: 13px; color: var(--ink);
  }
  .model-search input:focus { outline: none; border-color: var(--green); }
  .model-list { max-height: 320px; overflow-y: auto; }
  .opt {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px;

  }

  .opt-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .opt-saved { color: var(--green); font-size: 13px; font-variant-numeric: tabular-nums; }
  .opt-meta { grid-column: 1 / -1; color: var(--quiet); font-size: 11px; }
  .est {
    display: inline-block; margin-left: 6px; padding: 1px 5px; border-radius: 5px;
    background: var(--wash); color: var(--muted); font-size: 11px; font-weight: 450;

  }
  .range-pop { width: 520px; padding: 14px; }

  }

  .range-body { display: grid; grid-template-columns: 198px 1fr; gap: 16px; margin-top: 14px; }
  .range-fields { display: flex; flex-direction: column; gap: 10px; }
  .range-fields label { color: var(--muted); font-size: 12px; }
  .dt-box {
    display: flex; align-items: center; gap: 8px; height: 42px; margin-top: 6px;
    padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
  }
  .dt-box:focus-within { border-color: var(--green); }
  .dt-box input { border: 0; background: transparent; font: inherit; font-size: 13px; color: var(--ink); min-width: 0; padding: 0; }
  .dt-box input:focus { outline: none; }
  .dt-box input[type="date"] { width: 118px; }
  .dt-box input[type="time"] { width: 74px; }
  .follow { display: flex; align-items: center; gap: 8px; margin-top: 4px; color: var(--ink); font-size: 13px; cursor: pointer; }
  .follow input { accent-color: var(--green); }
  .cal { min-width: 0; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
  .cal-head button { width: 28px; height: 28px; border: 0; background: transparent; cursor: pointer; color: var(--muted); border-radius: 6px; }
  .cal-head button:hover { background: var(--wash); color: var(--ink); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-grid span, .cal-grid button { height: 30px; display: grid; place-items: center; font-size: 12px; }
  .cal-grid span { color: var(--quiet); }
  .cal-grid button { border: 0; background: transparent; cursor: pointer; border-radius: 7px; color: var(--ink); }
  .cal-grid button.mute { color: #c4c8c4; }
  .cal-grid button.on { background: var(--green); color: #fff; }
  .cal-grid button.in { background: rgba(7, 139, 69, .12); }
  .range-actions { display: flex; justify-content: flex-end; gap: 16px; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
  .range-actions button { border: 0; background: transparent; cursor: pointer; font-size: 14px; color: var(--muted); }
  .range-actions .confirm { min-width: 76px; height: 32px; padding: 0 16px; border-radius: 8px; background: var(--green); color: #fff; font-size: 13px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; padding: 30px 0 32px; }
  .kpi { min-width: 0; padding: 0 28px; }

  .kpi.clickable:hover .kpi-label { color: var(--green); }

    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .kpi-value small { margin-left: 3px; font-size: 26px; }
  .kpi-label { margin-top: 14px; color: #272a27; font-size: 16px; }
  .kpi-sub { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .composition { padding: 34px 0 36px; border-top: 1px solid var(--line); position: relative; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
  h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.025em; }
  .range-label { color: var(--muted); font-size: 15px; white-space: nowrap; }
  .comp-bar { display: flex; gap: 2px; height: 12px; border-radius: 999px; overflow: hidden; background: rgba(243,245,243,.9); box-shadow: inset 0 1px 2px rgba(17,19,17,.04); }
  .comp-seg { height: 100%; min-width: 3px; transition: flex-grow .4s cubic-bezier(.22,.8,.2,1), opacity .18s ease, filter .18s ease; cursor: default; }
  .comp-bar:hover .comp-seg { opacity: .42; }
  .comp-bar .comp-seg:hover, .comp-bar .comp-seg.on { opacity: 1; filter: saturate(1.08); }
  .comp-legend {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 2px 28px; margin: 18px 0 0; padding: 0; list-style: none;
  }
  .comp-legend li {
    display: grid; grid-template-columns: 10px minmax(0,1fr) auto 44px; align-items: center; gap: 10px;

    cursor: default; transition: background .18s ease;
  }
  .comp-legend li.on { background: var(--wash); }
  .comp-legend .chip { width: 10px; height: 10px; border-radius: 3px; }
  .comp-legend .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comp-legend .tokens { color: var(--save-text); font-variant-numeric: tabular-nums; }
  .comp-legend .share { width: 44px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .comp-legend li.kept .tokens { color: var(--kept-text); }
  .ledger { padding: 34px 0 36px; border-top: 1px solid var(--line); }
  .heat { display: grid; grid-template-columns: minmax(280px, 1.2fr) minmax(220px, .8fr); gap: 28px 48px; align-items: end; }
  .heat-hero { display: flex; align-items: flex-end; gap: 18px; min-width: 0; }
  .heat-pct {
    font-size: 64px; font-weight: 620; letter-spacing: -.05em; line-height: .92;
    font-variant-numeric: tabular-nums;
  }
  .heat-pct small { font-size: 28px; font-weight: 560; letter-spacing: -.03em; margin-left: 2px; }
  .heat-copy { padding-bottom: 6px; min-width: 0; }
  .heat-title { font-size: 16px; font-weight: 600; letter-spacing: .08em; }
  .heat-sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; max-width: 36em; }
  .heat-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 28px; }
  .heat-stats .n { font-size: 22px; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .heat-stats .l { margin-top: 6px; color: var(--muted); font-size: 13px; }
  .heat-shine {
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: heat-flow 4.2s linear infinite;
    transform: translateZ(0);
  }
  .heat-shine.tier-apex {
    background-image: linear-gradient(90deg, #ff5b7a, #ffb347, #ffe566, #7dffb3, #6bb8ff, #c77dff, #ff5b7a, #ffb347, #ffe566, #7dffb3, #6bb8ff, #c77dff, #ff5b7a);
  }
  .heat-shine.tier-gold {
    background-image: linear-gradient(90deg, #8a6414, #e8c15a, #fff4c8, #d4a017, #8a6414, #e8c15a, #fff4c8, #d4a017, #8a6414);
  }
  .heat-shine.tier-blue {
    background-image: linear-gradient(90deg, #1f5eaa, #7eb4ee, #e7f2fc, #3d86d4, #1f5eaa, #7eb4ee, #e7f2fc, #3d86d4, #1f5eaa);
  }
  .heat-shine.tier-plain {
    background: none; color: var(--quiet); -webkit-text-fill-color: var(--quiet); animation: none;
  }
  @keyframes heat-flow {
    from { background-position: 0% 50%; }
    to { background-position: 100% 50%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .heat-shine { animation: none; background-position: 40% 50%; }
  }
  @media (max-width: 800px) {
    .heat, .heat-stats { grid-template-columns: 1fr 1fr; }
    .heat-hero { grid-column: 1 / -1; }
    .heat-pct { font-size: 48px; }
  }
  .row-trend { display: grid; grid-template-columns: 8fr 4fr; column-gap: 40px; padding: 34px 0 36px; border-top: 1px solid var(--line); }

  .by-source { align-self: start; }
  .legend { display: flex; align-items: center; gap: 28px; margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .legend span { display: inline-flex; align-items: center; gap: 10px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--save-400); }

  .chart-modes { display: inline-flex; gap: 2px; padding: 2px; border-radius: 999px; background: var(--wash); }

    background: transparent; color: var(--muted); font-size: 12px; cursor: pointer;
  }
  .chart-modes button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(17, 19, 17, .08); }

  .tip {
    position: absolute; z-index: 12; min-width: 152px; padding: 9px 11px;
    border-radius: 9px; background: rgba(17, 19, 17, .94); color: #fff;

    box-shadow: 0 10px 26px rgba(17, 19, 17, .22);
  }

  .tip .row span:first-child { color: rgba(255, 255, 255, .68); }
  .comp-tip {
    position: absolute; z-index: 6; min-width: 168px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink);
    font-size: 12px; line-height: 1.55; pointer-events: none;
    box-shadow: 0 14px 36px rgba(17, 19, 17, .12);
    opacity: 0; transform: translateY(6px);
    transition: opacity .18s ease, transform .18s cubic-bezier(.22,.8,.2,1);
  }
  .comp-tip.show { opacity: 1; transform: translateY(0); }
  .comp-tip b { font-weight: 600; }
  .comp-tip .row { display: flex; justify-content: space-between; gap: 16px; font-variant-numeric: tabular-nums; }
  .comp-tip .row span:first-child { color: var(--muted); }
  .chart { position: relative; height: 300px; }

  .grid-line { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 4 5; }
  .axis-text { fill: var(--muted); font-size: 12px; font-family: inherit; }

  .source-row.dim { opacity: .55; }
  .source-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; white-space: nowrap; }
  .cap-hook { background: var(--save-50); color: var(--save-text); }

  tools: [

function esc(value) { return String(value ?? "").replace(/[&<>'"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[ch])); }

function money(value) {

  if (n > 0 && n < 0.01) return "<$0.01";

}
function rate(value) {

function tween(node, next, formatter) {

function renderChart(series) {

  });
  const max = share ? 1 : niceMax(Math.max(...rows.map((r) => r.raw), 1));
  const slot = plotW / Math.max(1, rows.length);
  const barW = Math.max(3, Math.min(20, slot * 0.56));
  const y = (v) => pad.top + plotH - (max === 0 ? 0 : (v / max) * plotH);
  const grid = Array.from({ length: 5 }, (_, i) => {
    const value = max * (4 - i) / 4;
    const yy = pad.top + i * plotH / 4;
    const text = share ? `${Math.round(value * 100)}%` : compact(value);
    return `<line class="grid-line" x1="${pad.left}" x2="${w - pad.right}" y1="${yy}" y2="${yy}"/><text class="axis-text" x="0" y="${yy + 4}">${text}</text>`;
  }).join("");
  const ticks = axisTicks(rows.length);
  const cols = rows.map((r, i) => {
    const cx = pad.left + slot * (i + 0.5);
    const x = cx - barW / 2;
    const total = share ? (r.raw > 0 ? 1 : 0) : r.raw;
    const kept = share ? (r.raw > 0 ? r.delivered / r.raw : 0) : r.delivered;
    const topY = y(total);
    const keptY = y(kept);
    const base = pad.top + plotH;
    const avoidedH = Math.max(0, keptY - topY);
    const keptH = Math.max(0, base - keptY);
    const seg = [];
    if (avoidedH > 0.4) seg.push(`<rect class="col-avoided" x="${x}" y="${topY}" width="${barW}" height="${avoidedH}" rx="1.5"/>`);
    if (keptH > 0.4) seg.push(`<rect class="col-delivered" x="${x}" y="${keptY}" width="${barW}" height="${keptH}" rx="1.5"/>`);
    if (!seg.length) seg.push(`<rect class="col-avoided" x="${x}" y="${base - 1.5}" width="${barW}" height="1.5" opacity=".5"/>`);

function bindChartTips(host, rows) {

function renderComposition(rows, totals) {

    tip.innerHTML = `<b>${esc(r.label)}</b><div class="row"><span>tokens</span><span>${compact(r.tokens)}</span></div><div class="row"><span>占原文</span><span>${(r.share * 100).toFixed(1)}%</span></div>`;

function axisTicks(n) {

  const maxLabels = n > 14 ? 6 : n > 8 ? 5 : n;
  const step = Math.max(1, Math.round((n - 1) / Math.max(1, maxLabels - 1)));
  for (let i = 0; i < n; i += step) keep.add(i);

}
function pad2(n) { return String(n).padStart(2, "0"); }

}
function fromLocalParts(date, time) {

function applyPreset(kind, commit) {

function renderCalendar() {

  const days = new Date(year, month + 1, 0).getDate(); const prevDays = new Date(year, month, 0).getDate();
  const { start, end } = draftWindow();

  const endDay = new Date(end); endDay.setHours(0,0,0,0);
